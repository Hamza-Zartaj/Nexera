<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      form {
        padding: 2rem;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      h1 {
        text-align: center;
      }

      body {
        padding: 2rem;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      input {
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 1rem;
      }

      .json-file-container {
        margin-top: 2rem;
        padding: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        background-color: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <h1>Blog Json Generator using AI (dev purpose only!!!!)</h1>
    <form id="blog-form" method="POST">
      <label style="display: block" for="title">Title</label>
      <input type="text" id="title" placeholder="Title" />

      <input type="submit" />
    </form>

    <div class="json-file-container">
      <h1>Generated JSON (copy it)</h1>
    </div>

    <script>
      document
        .getElementById("blog-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const title = document.getElementById("title").value;

          if (!title) {
            alert("Please enter a title");
            return;
          }

          try {
            const response = await fetch("http://localhost:5000/api/ai/blog", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ title }),
            });

            if (!response.ok) {
              throw new Error("Network response was not ok");
            }

            const data = await response.json();
            console.log(data);
            const jsonContainer = document.querySelector(
              ".json-file-container"
            );
            jsonContainer.innerHTML = `<h1>Generated JSON (copy it)</h1><pre>${JSON.stringify(
              data,
              null,
              2
            )}</pre>`;
            const jsonBlob = new Blob([JSON.stringify(data, null, 2)], {
              type: "application/json",
            });
            const jsonUrl = URL.createObjectURL(jsonBlob);
            const downloadLink = document.createElement("a");
            downloadLink.href = jsonUrl;
            downloadLink.download = "blog.json";
            downloadLink.textContent = "Download JSON";
            jsonContainer.appendChild(downloadLink);
            jsonContainer.appendChild(document.createElement("br"));
            const copyButton = document.createElement("button");
            copyButton.textContent = "Copy JSON to Clipboard";
            copyButton.addEventListener("click", () => {
              navigator.clipboard.writeText(JSON.stringify(data, null, 2));
              alert("JSON copied to clipboard!");
            });
            jsonContainer.appendChild(copyButton);
          } catch (error) {
            console.error("Error:", error);
            alert("Failed to generate blog. Please try again.");
          }
        });
    </script>
  </body>
</html>
